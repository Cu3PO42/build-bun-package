name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      all-platforms:
        description: Also test aarch64-linux and aarch64-darwin
        type: boolean
        default: false
      integration:
        description: Build the real-world integration packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Formatting and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false
      - name: Check formatting, Nix syntax, ShellCheck, and workflows
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.formatting \
            .#checks.x86_64-linux.shellcheck \
            .#checks.x86_64-linux.actionlint \
            .#checks.x86_64-linux.parse-nix-stable \
            .#checks.x86_64-linux.parse-nix-latest \
            .#checks.x86_64-linux.parse-lix

  tests:
    name: Tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.all-platforms && '["x86_64-linux","aarch64-linux","aarch64-darwin"]' || '["x86_64-linux"]') }}
    runs-on: ${{ fromJSON('{"x86_64-linux":"ubuntu-24.04","aarch64-linux":"ubuntu-24.04-arm","aarch64-darwin":"macos-15"}')[matrix.system] }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false
      - name: Evaluate all supported systems
        run: nix flake check --all-systems --no-build
      - name: Build and run checks
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$NIX_SYSTEM"
          nix flake check --keep-going --print-build-logs

  integration:
    name: Integration — ${{ matrix.package }} (${{ matrix.system }})
    if: ${{ inputs.integration }}
    needs: [lint, tests]
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.all-platforms && '["x86_64-linux","aarch64-linux","aarch64-darwin"]' || '["x86_64-linux"]') }}
        package:
          - balatro-mod-manager-web
          - equibop
          - filen-cli
          - gitlab-ci-local
          - handy-frontend
          - kulala-core
          - models-dev
          - opencode
          - swagger-typescript-api
        exclude:
          - system: aarch64-darwin
            package: equibop
    runs-on: ${{ fromJSON('{"x86_64-linux":"ubuntu-24.04","aarch64-linux":"ubuntu-24.04-arm","aarch64-darwin":"macos-15"}')[matrix.system] }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free space for large runtime closures
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: false
      - name: Build integration package and run its installation checks
        env:
          NIX_SYSTEM: ${{ matrix.system }}
          PACKAGE: ${{ matrix.package }}
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$NIX_SYSTEM"
          nix build --no-link --print-build-logs ".#packages.$NIX_SYSTEM.example-$PACKAGE"
